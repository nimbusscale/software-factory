# Claude Code asks the owner before each edit to this file, so an agent can't weaken a check to
# make it pass.

# Standard ** matching: src/**/* covers files at any depth under src.
glob_matcher: doublestar

pre-commit:
  commands:
    check:
      # Only when a staged file can change the check's result, so a commit that changes only docs
      # skips it.
      glob:
        - "src/**/*"
        - "pyproject.toml"
        - "uv.lock"
        - ".python-version"
        - "ruff.toml"
        - "mypy.ini"
        - "tools/check-code.sh"
      run: bash tools/check-code.sh
