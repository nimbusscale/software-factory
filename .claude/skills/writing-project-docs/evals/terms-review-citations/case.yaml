schema_version: "1.1"
name: terms-review-citations
expected_outcome: |
  The change adds five terms to the spec. The reviewer edits nothing. It lists the citations on
  Organizer (FR-3) and Waitlist (FR-4) as problems in this change. Organizer's meaning doesn't
  depend on FR-3, which only lets an organizer cancel. FR-4 only says how a member joins a
  waitlist. It doesn't call the citation on No-show (FR-7) a problem, since what "in time" means
  depends on FR-7's rule. It doesn't call the citation on Check-in (F-SEC-3) a problem, since
  that section holds every rule about checking in.
