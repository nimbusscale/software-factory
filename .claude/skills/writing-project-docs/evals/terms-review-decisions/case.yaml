schema_version: "1.1"
name: terms-review-decisions
expected_outcome: |
  The technical spec's AD-2 splits the app into a web server and a worker, and AD-3 says the worker
  runs every task and the web server runs none. TD-1 says a task is tried up to three times. The
  change adds three terms, TR-2, TR-3 and TD-2. Worker is "the part of the app that runs tasks
  (AD-2)": its definition names the worker's main job, which is fine, but a term never cites an
  architecture decision. Web server says it "never runs a task", which copies AD-3. Failed task is
  "a task that still fails after its last try (TD-1)", and its meaning depends on TD-1's count, so
  the citation is fine. TR-2 says that when the worker starts after being stopped, it runs every
  task whose time passed while it was stopped, and TD-2 keeps tasks as rows in the database to
  meet it. TR-2 names the worker, a part AD-2 created, and leaves open how the worker meets it, so
  it's a requirement. The reviewer edits nothing, lists the Worker citation and Web server's "never
  runs a task" as problems in this change, and doesn't object to Worker's "runs tasks" or to
  Failed task's citation. It doesn't say that TR-2 shouldn't name the worker, or that TR-2 is a
  decision rather than a requirement.
context:
  scaffold_script: place-files.sh
