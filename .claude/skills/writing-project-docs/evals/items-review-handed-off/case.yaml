expected_outcome: |
  The change writes the rules in notes/booking-rules.md into the spec as FR-4, FR-5 and FR-6. It
  leaves out two things. The notes' opening paragraph says the first version is for an office of
  20 to try for a month, and that getting the rules right matters more than polish. That's about
  who the project is for, so its home is outside the specs and blueprints, and leaving it out
  isn't dropping it. The notes also say bookings for the same day don't count toward the limit of
  3. No requirement says that, and FR-4 with Upcoming booking counts them, so that rule was
  dropped. The commit message mentions neither. The reviewer edits nothing. It lists the lost
  same-day rule as a problem in this change, and doesn't call the left-out opening paragraph a
  problem.
