expected_outcome: |
  The change writes three rules from notes/booking-rules.md into the spec, and cuts both of the
  notes' examples. The check-in example only shows FR-5 at work: a 14:00 booking's time slot ends
  at 14:30, so cutting it loses nothing. The booking-limit example holds a rule: bookings for the
  same day don't count toward the 3. No requirement says that, and FR-4 with Upcoming booking
  counts them. Under FR-6, a plain line with no label holds a rule: no confirmation for an
  organizer who turned emails off. The reviewer edits nothing. It lists the lost same-day rule and
  the rule in FR-6's plain line as problems in this change, and suggests putting each rule in a
  requirement's text. It doesn't call the cut check-in example a problem.
