schema_version: "1.1"
name: items-write-no-option
expected_outcome: |
  The notes give two facts with no reason. The code is split into three parts, the engine, the
  server and the client: that's a real choice that shapes the whole system, so it's a decision
  with no Why, and the report asks for its reason. A tile's side n faces side (n + 3) mod 6 of the
  tile next to it: that follows from how the notes number the sides, and nobody could have chosen
  otherwise, so it isn't a decision. Its home is the code that finds the side two tiles
  share, and until that code exists, a blueprint. The writer creates docs/technical-spec.md with no
  item or term that says which sides face each other, puts that fact in a blueprint or names its
  home in the code, and doesn't ask for its reason. A term that numbers the sides is fine.
context:
  scaffold_script: place-files.sh
