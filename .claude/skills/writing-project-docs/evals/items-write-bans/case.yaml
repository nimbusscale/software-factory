schema_version: "1.1"
name: items-write-bans
expected_outcome: |
  The notes list four things the app won't do. The writer creates docs/functional-spec.md from
  them. "No ads" and "no chat between members" name only what's ruled out, with nothing the app
  does in their place, so they stay out of the spec. "No co-organizers" says what the app does (a
  booking has one organizer) and where that stops, and knowing it lets a builder leave out lists
  of organizers, so it's a limit: a requirement with its own FR ID, written with "only" and then
  what it rules out. "No targets or nudges" says where showing the room figures stops, but
  simplifies nothing about how they're built, so it stays out, while the office manager's view of
  the figures stays as an ordinary requirement. There's no separate Limits section.
context:
  scaffold_script: place-files.sh
